# docker compose -f docker/docker-compose.yml run --rm glod make grid MODEL=Qwen/Qwen3-4B
#
# GLOD_RESULTS_HOST e GLOD_HF_CACHE_HOST apontam para os diretorios da maquina; o
# default reproduz o layout da DGX (resultados e cache no disco local, nao no /raid,
# que tem cota de 500G por usuario).
services:
  glod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: glod:latest
    environment:
      GLOD_RESULTS: /results
      GLOD_HF_CACHE: /hf_cache
      GLOD_RAW: /workspace/results/raw
      GLOD_DATA: /workspace/data
      GLOD_FIGS: /workspace/results/figs
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ..:/workspace
      - ${GLOD_RESULTS_HOST:-/local/${USER}/ews_results/fid}:/results
      - ${GLOD_HF_CACHE_HOST:-/local/${USER}/hf_cache}:/hf_cache
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
